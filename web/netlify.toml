# Netlify — SubSenpai Web (SvelteKit, adapter-static)
# PENTING: base directory = web, jadi publish ditulis RELATIF terhadap
# base itu ("build" = web/build). Menulis "web/build" di sini membuat
# Netlify mencari web/web/build dan deploy gagal (kejadian 27 Nov 2026).
[build]
  base = "web"
  command = "npm run build"
  publish = "build"

[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
