# Netlify — SubSenpai Web (SvelteKit, adapter-static)
# PENTING: base directory = web, jadi publish ditulis RELATIF terhadap
# base itu ("build" = web/build). Menulis "web/build" di sini membuat
# Netlify mencari web/web/build dan deploy gagal (kejadian 27 Nov 2026).
[build]
  base = "web"
  command = "npm run build"
  publish = "build"

[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200

# Manifest PWA harus disajikan sebagai application/manifest+json —
# tanpa itu Chrome mengabaikan manifest (disajikan octet-stream)
# sehingga prompt install tak pernah muncul (temuan 28 Nov 2026).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Halaman /tv: jangan kirim Referer (28 Nov 2026). Origin Trans Media
# (live.cnbcindonesia.com) & detik (video.detik.com) menolak Referer
# asing (403) tapi melayani tanpa Referer + CORS * — tanpa header ini
# Trans TV/Trans7/CNN/CNBC gagal diputar di web (hls.js mengirim
# Referer halaman secara bawaan). Meta referrer di +page.svelte
# memperkuatnya dari sisi dokumen; header ini yang menjamin sejak
# dokumen dimuat (SPA, ssr=false — meta dari JS datang belakangan).
[[headers]]
  for = "/tv"
  [headers.values]
    Referrer-Policy = "no-referrer"

